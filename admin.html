<script>
/* ============================================================
   ilm Toy Admin — logic
   ============================================================ */
let SB = null;
let SESSION = null;

const $  = (s,r=document)=>r.querySelector(s);
const el = (html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;};
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bdt = (n)=>'৳'+Number(n||0).toLocaleString('en-US');
const fmtDate = (s)=>{try{return new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return s||'';}};

function toast(msg,type=''){ const t=el(`<div class="toast ${type}">${esc(msg)}</div>`); $('#toast').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2600); }

/* ---------- Boot ---------- */
function boot(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    const n=$('#setupNote'); n.classList.remove('hidden');
    n.innerHTML='⚠️ First set <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> in the file (Project Settings → API).';
    $('#loginBtn').disabled=true; return;
  }
  SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  SB.auth.getSession().then(({data})=>{ if(data.session){ SESSION=data.session; showApp(); } });
}

$('#loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=$('#loginBtn'); btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span>';
  const {data,error} = await SB.auth.signInWithPassword({ email:$('#email').value.trim(), password:$('#password').value });
  btn.disabled=false; btn.textContent=old;
  if(error){ toast(error.message||'Login failed', 'err'); return; }
  SESSION=data.session; showApp();
});

$('#logoutBtn').addEventListener('click', async ()=>{ await SB.auth.signOut(); location.reload(); });

function showApp(){
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#whoami').textContent = SESSION?.user?.email || '';
  $('#navTabs').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{ setTab(b.dataset.tab); });
  });
  setTab('dashboard');
}
function setTab(tab){
  $('#navTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  ({dashboard:renderDashboard, products:renderProducts, orders:renderOrders, coupons:renderCoupons,
    reviews:renderReviews, pages:renderPages, blog:renderBlog, settings:renderSettings}[tab])();
}
function loadingView(){ $('#view').innerHTML='<div class="loading"><span class="spin" style="border-color:var(--accent);border-top-color:transparent"></span></div>'; }
function head(title, actionHtml=''){ return `<div class="page-head"><h2>${esc(title)}</h2>${actionHtml}</div>`; }
function emptyBox(icon,msg,btn=''){ return `<div class="empty"><div class="em-ic">${icon}</div><p>${esc(msg)}</p>${btn}</div>`; }

/* ---------- Generic DB helpers ---------- */
async function dbList(table, order='id', asc=true){
  const {data,error}=await SB.from(table).select('*').order(order,{ascending:asc});
  if(error){ toast(error.message,'err'); return []; } return data||[];
}
async function dbSave(table, obj, id){
  let res;
  if(id!=null && id!=='') res=await SB.from(table).update(obj).eq('id',id);
  else res=await SB.from(table).insert(obj);
  if(res.error){ toast(res.error.message,'err'); return false; } return true;
}
async function dbDelete(table, id){
  const {error}=await SB.from(table).delete().eq('id',id);
  if(error){ toast(error.message,'err'); return false; } return true;
}
/* ---------- Storage: Image upload ---------- */
/* আপলোডের আগে ছবি ছোট + কম্প্রেস করে — ৪ MB এর ছবি ~২০০ KB হয়ে যায় */
/* maxW 1400 → 1200: সাইটের সবচেয়ে বড় CDN bucket-ও 1200, তাই এর বেশি রাখার
   মানে নেই। wsrv প্রতিবার cache ভরতে এই অরিজিনালটাই নামায়, তাই অরিজিনাল ছোট
   হলে Supabase egress সরাসরি কমে। quality 0.82 → 0.80, চোখে ধরা পড়ে না। */
function compressImage(file, maxW=1200, quality=0.80){
  return new Promise(resolve=>{
    if(!/^image\//.test(file.type) || /gif|svg/i.test(file.type)) return resolve(file);
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        URL.revokeObjectURL(url);
        const scale=Math.min(1, maxW/(img.naturalWidth||img.width||maxW));
        const c=document.createElement('canvas');
        c.width =Math.max(1, Math.round((img.naturalWidth ||img.width )*scale));
        c.height=Math.max(1, Math.round((img.naturalHeight||img.height)*scale));
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);   // PNG-এর স্বচ্ছ অংশ কালো না হওয়ার জন্য
        ctx.drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>resolve((b && b.size < file.size) ? b : file), 'image/jpeg', quality);
      }catch(e){ resolve(file); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}
async function uploadImages(fileList, statusEl, onUrl){
  const files=[...fileList];
  for(let i=0;i<files.length;i++){
    const orig=files[i];
    if(statusEl) statusEl.textContent=`Compressing... (${i+1}/${files.length})`;
    const file=await compressImage(orig);
    const isJpg=(file!==orig);
    const ext=isJpg?'jpg':((orig.name.split('.').pop()||'jpg').toLowerCase());
    const kb=Math.round(file.size/1024);
    if(statusEl) statusEl.textContent=`Uploading... (${i+1}/${files.length}) — ${kb} KB`;
    const path='products/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
    const {error}=await SB.storage.from('product-images').upload(path,file,{cacheControl:'31536000',contentType:isJpg?'image/jpeg':(orig.type||undefined),upsert:false});
    if(error){ toast('Upload failed: '+error.message,'err'); if(statusEl)statusEl.textContent='❌ Upload failed ('+error.message+')'; continue; }
    const {data}=SB.storage.from('product-images').getPublicUrl(path);
    onUrl(data.publicUrl);
  }
  if(statusEl) statusEl.textContent='✓ Upload done';
}

/* ---------- Modal ---------- */
function openModal(title, bodyHtml, onSave, saveLabel='Save', extraClass=''){
  const ov=el(`<div class="overlay"><div class="modal ${extraClass}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-x>✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-save>${esc(saveLabel)}</button>
    </div></div></div>`);
  const close=()=>ov.remove();
  ov.addEventListener('click',(e)=>{ if(e.target===ov) close(); });
  ov.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',close));
  ov.querySelector('[data-save]').addEventListener('click', async (e)=>{
    const btn=e.currentTarget; btn.disabled=true; const t=btn.textContent; btn.innerHTML='<span class="spin"></span>';
    const ok=await onSave(ov); btn.disabled=false; btn.textContent=t; if(ok!==false) close();
  });
  $('#modalMount').appendChild(ov); return ov;
}
function confirmModal(msg, onYes){
  const ov=el(`<div class="overlay"><div class="modal" style="max-width:360px">
    <div class="modal-body" style="padding-top:22px;text-align:center">${esc(msg)}</div>
    <div class="modal-foot"><button class="btn ghost" data-x>No</button><button class="btn danger" data-yes>Yes, delete</button></div>
  </div></div>`);
  const close=()=>ov.remove();
  ov.addEventListener('click',(e)=>{if(e.target===ov)close();});
  ov.querySelector('[data-x]').addEventListener('click',close);
  ov.querySelector('[data-yes]').addEventListener('click',async(e)=>{e.currentTarget.disabled=true;await onYes();close();});
  $('#modalMount').appendChild(ov);
}

let _products=[];
/* সিরিয়াল র‍্যাঙ্ক: খালি / 0 / non-number → সবার নিচে (Infinity) */
function serialRank(p){
  var s = p && p.sort_order;
  if(s===null || s===undefined || s==='' || Number(s)===0) return Infinity;
  var n = Number(s);
  return isNaN(n) ? Infinity : n;
}
function sortBySerial(a,b){
  var d = serialRank(a) - serialRank(b);
  if(d!==0) return d;                       // ছোট সিরিয়াল আগে; 0/blank সব শেষে
  return (a.name||'').localeCompare(b.name||''); // tie হলে নাম অনুসারে
}
/* নতুন প্রোডাক্টের অটো-সিরিয়াল কোড = বর্তমান সর্বোচ্চ Product ID + ১ */
function nextProductCode(){
  var ids=(_products||[]).map(function(p){return Number(p && p.id);}).filter(function(n){return isFinite(n);});
  return ids.length ? Math.max.apply(null, ids)+1 : '';
}
async function renderProducts(){
  loadingView();
  _products = await dbList('products','sort_order',true);
  _products.sort(sortBySerial);            // 0/blank নিচে নামানোর জন্য ক্লায়েন্ট-সাইড রি-সর্ট
  drawProducts();
}

let _orders=[], _oCounts={}, _oSel=new Set(), _oTab='', _oTrunc=false;

const ORDER_STATES=['new','confirm','processing','on_the_way','in_courier','delivered','cancelled','returned'];
const ORDER_LABEL={new:'Pending',confirm:'Confirmed',processing:'Processing',on_the_way:'On The Way',
                   in_courier:'In Courier',delivered:'Completed',cancelled:'Cancelled',returned:'Returned'};
const ORDER_PILL ={new:'blue',confirm:'blue',processing:'amber',on_the_way:'amber',
                   in_courier:'amber',delivered:'green',cancelled:'red',returned:'red'};
const ORDER_LIMIT=300;   // একবারে সর্বোচ্চ কত সারি আনবে

/* সাইটের নাম/ফোন — প্রিন্টের হেডারে লাগে */

async function renderOrders(){
  _oSel.clear(); _oTab='';
  $('#view').innerHTML = head('Orders', '<button class="btn ghost sm" id="oRefresh">\u21bb Refresh</button>')
    + '<div class="stabs" id="oTabs"></div>'

    +   '<select id="oBulkStatus"><option value="">Change status to\u2026</option>'

  });
  $('#oAll').addEventListener('change', e=>{
    if(e.target.checked) _orders.forEach(o=>_oSel.add(o.id)); else _oSel.clear();
    drawOrders();
  });
  $('#oApply').addEventListener('click', bulkStatus);
  $('#oDel').addEventListener('click', bulkDelete);
  $('#oCsv').addEventListener('click', exportCsv);
  $('#oPrintS').addEventListener('click', ()=>printOrders('sticker'));

async function loadOrders(){
  const list=$('#oList');
  if(list) list.innerHTML='<div class="loading"><span class="spin" style="border-color:var(--accent);border-top-color:transparent"></span></div>';
  _oSel.clear();

  const q    = ($('#oSearch')?.value||'').trim();
  const from = $('#oFrom')?.value||'';
  const to   = $('#oTo')?.value||'';

  let sel = SB.from('orders').select('*').order('created_at',{ascending:false}).limit(ORDER_LIMIT);
  if(_oTab) sel = sel.eq('status', _oTab);
  if(from)  sel = sel.gte('created_at', from+'T00:00:00');
  if(to)    sel = sel.lte('created_at', to+'T23:59:59.999');
  if(q){
    const safe = q.replace(/[,()%]/g,' ').trim();
    if(safe) sel = sel.or('order_id.ilike.%'+safe+'%,customer_name.ilike.%'+safe+'%,phone.ilike.%'+safe+'%');
  }

  const [res, cnt] = await Promise.all([ sel, SB.rpc('order_counts') ]);
  if(res.error){ toast(res.error.message,'err'); _orders=[]; }
  else _orders = res.data||[];
  _oTrunc  = _orders.length >= ORDER_LIMIT;
  _oCounts = (cnt && !cnt.error && cnt.data) ? cnt.data : {};

  drawOrderTabs();
  drawOrders();
}

function drawOrderTabs(){
  const box=$('#oTabs'); if(!box) return;
  const total = Object.values(_oCounts).reduce((s,n)=>s+Number(n||0),0);
  let html = '<button class="stab'+(_oTab===''?' on':'')+'" data-s="">All ('+total+')</button>';
  ORDER_STATES.forEach(s=>{
    const n = Number(_oCounts[s]||0);
    html += '<button class="stab '+(ORDER_PILL[s]||'gray')+(_oTab===s?' on':'')+'" data-s="'+s+'">'
          + ORDER_LABEL[s]+' ('+n+')</button>';
  });
  box.innerHTML=html;
  box.querySelectorAll('.stab').forEach(b=>{
    b.addEventListener('click',()=>{ _oTab=b.dataset.s; loadOrders(); });
  });
}

function refreshBulkBar(){
  const n=_oSel.size;
  const lbl=$('#oSelN'); if(lbl) lbl.textContent = n ? (n+' selected') : 'None selected';
  document.querySelectorAll('.bulk-act').forEach(b=>{ b.disabled = n===0; });
  const all=$('#oAll');
  if(all) all.checked = n>0 && n===_orders.length;
}

function drawOrders(){
  const list=$('#oList'); if(!list) return;
  if(!_orders.length){
    list.innerHTML=emptyBox('\ud83e\uddfe','No orders found.');
    refreshBulkBar(); return;
  }
  list.innerHTML = _oTrunc
    ? '<div class="hintbar">Showing the latest '+ORDER_LIMIT+' orders. Narrow it down with the date range or search.</div>'
    : '';
  _orders.forEach(o=>{
    const pill='<span class="pill '+(ORDER_PILL[o.status]||'gray')+'">'+(ORDER_LABEL[o.status]||o.status)+'</span>';
    const paid=/paid|confirm|verified/i.test(o.payment_status||'')
      ? '<span class="pill green">Paid</span>' : '';
    const row=el('<div class="row orow'+(_oSel.has(o.id)?' sel':'')+'">'
      + '<label class="ckwrap rowck"><input type="checkbox" '+(_oSel.has(o.id)?'checked':'')+'></label>'
      + '<div class="main">'
      +   '<div class="title">'+esc(o.customer_name)+' \u00b7 '+bdt(o.total)+' '+pill+' '+paid+'</div>'
      +   '<div class="meta">'+esc(o.phone)+' \u00b7 '+esc(o.order_id)+' \u00b7 '+fmtDate(o.created_at)+'</div>'
      + '</div>'
      + '<div class="acts"><button class="icon-btn" title="Details">\ud83d\udc41\ufe0f</button></div></div>');
    const ck=row.querySelector('input[type=checkbox]');
    ck.addEventListener('change',e=>{
      e.stopPropagation();
      if(ck.checked) _oSel.add(o.id); else _oSel.delete(o.id);
      row.classList.toggle('sel', ck.checked);
      refreshBulkBar();
    });
    row.querySelector('.rowck').addEventListener('click',e=>e.stopPropagation());
    row.addEventListener('click',()=>orderDetail(o));
    list.appendChild(row);
  });
  refreshBulkBar();
}

/* ---------- Bulk actions ---------- */
async function bulkStatus(){
  const st=$('#oBulkStatus').value;
  if(!st){ toast('Pick a status first','err'); return; }
  const ids=[..._oSel];
  const {error}=await SB.from('orders').update({status:st}).in('id',ids);
  if(error){ toast(error.message,'err'); return; }
  toast(ids.length+' order(s) \u2192 '+ORDER_LABEL[st],'ok');
  $('#oBulkStatus').value='';
  loadOrders();
}

async function bulkDelete(){
  const ids=[..._oSel];
  if(!confirm(ids.length+' order(s) will be deleted permanently. This cannot be undone.\n\nContinue?')) return;
  const {error}=await SB.from('orders').delete().in('id',ids);
  if(error){ toast(error.message,'err'); return; }
  toast(ids.length+' order(s) deleted','ok');
  loadOrders();
}

function selectedOrders(){
  return _oSel.size ? _orders.filter(o=>_oSel.has(o.id)) : _orders;
}

/* ---------- CSV ---------- */
function exportCsv(){
  const rows=selectedOrders();
  if(!rows.length){ toast('Nothing to export','err'); return; }
  const cols=['order_id','created_at','customer_name','phone','address','product_summary',
              'qty_total','subtotal','coupon','discount','delivery_area','delivery_charge',
              'total','payment_method','payment_status','trx_id','status','note'];
  const cell=v=>{
    const s=String(v??'').replace(/"/g,'""');
    return /[",\n]/.test(s) ? '"'+s+'"' : s;
  };
  const csv=[cols.join(',')].concat(rows.map(o=>cols.map(c=>cell(o[c])).join(','))).join('\r\n');
  // \uFEFF = BOM — না দিলে Excel-এ বাংলা লেখা ভেঙে যায়
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='orders-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(rows.length+' order(s) exported','ok');
}

function orderItems(o){
  try{ return Array.isArray(o.items)?o.items:JSON.parse(o.items||'[]'); }catch(e){ return []; }
}

/* ---------- Detail ---------- */
let _delivCharges=null;
async function getDelivCharges(){
  if(_delivCharges) return _delivCharges;
  try{
    const rows=await dbList('settings','key',true);
    const m={}; rows.forEach(r=>{ m[r.key]=r.value; });
    _delivCharges={ dhaka:Number(m.delivery_dhaka)||0, outside:Number(m.delivery_outside)||0 };
  }catch(e){ _delivCharges={dhaka:0,outside:0}; }
  return _delivCharges;
}

async function orderDetail(o){
  const charges=await getDelivCharges();
  const items=orderItems(o);
  const itemsHtml = items.length
    ? items.map(it=>'<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>'+esc(it.name)+' \u00d7 '+it.qty+'</span><span>'+bdt((it.price||0)*(it.qty||1))+'</span></div>').join('')
    : '<div style="color:var(--soft)">'+esc(o.product_summary||'\u2014')+'</div>';
  const isOutside = /out|bair|\u09ac\u09be\u0987\u09b0|\u09ac\u09be\u09b9\u09bf\u09b0/i.test(String(o.delivery_area||''));

  // স্ট্যাটাস বদলের ইতিহাস
  let logHtml='';
  try{
    const {data:logs}=await SB.from('order_status_log').select('*')
      .eq('order_ref',o.id).order('changed_at',{ascending:false}).limit(8);
    if(logs&&logs.length){
      logHtml='<div style="margin-top:14px;font-size:12px;color:var(--soft);line-height:1.9">'
        + '<b style="color:var(--ink)">History</b><br>'
        + logs.map(l=>fmtDate(l.changed_at)+' \u00b7 '
            +(ORDER_LABEL[l.from_status]||l.from_status||'?')+' \u2192 '
            +(ORDER_LABEL[l.to_status]||l.to_status)).join('<br>')
        + '</div>';
    }
  }catch(e){}

  const body=''
    + '<div class="grid2">'
    +   '<label class="fld"><span>Customer name</span><input id="o_name" value="'+esc(o.customer_name||'')+'"></label>'
    +   '<label class="fld"><span>Phone</span><input id="o_phone" value="'+esc(o.phone||'')+'"></label>'
    + '</div>'
    + '<label class="fld"><span>Address</span><textarea id="o_addr" style="min-height:60px">'+esc(o.address||'')+'</textarea></label>'
    + '<label class="fld"><span>Note</span><input id="o_note" value="'+esc(o.note||'')+'"></label>'
    + '<div style="margin:14px 0">'+itemsHtml+'</div>'
    + '<div style="font-size:14px;color:var(--soft);line-height:1.8;margin-bottom:8px">'
    +   'Subtotal: '+bdt(o.subtotal)+'<br>'
    +   (o.coupon?'Coupon ('+esc(o.coupon)+'): \u2212'+bdt(o.discount)+'<br>':'')
    +   'Payment: '+esc(o.payment_method||'')+' '+(o.trx_id?'\u00b7 TrxID '+esc(o.trx_id):'')
    +   (o.ip_address?'<br>IP: '+esc(o.ip_address):'')
    + '</div>'
    + '<div class="grid2">'
    +   '<label class="fld"><span>Delivery zone</span><select id="o_zone">'
    +     '<option value="dhaka"'+(isOutside?'':' selected')+'>Inside Dhaka</option>'
    +     '<option value="outside"'+(isOutside?' selected':'')+'>Outside Dhaka</option></select></label>'
    +   '<label class="fld"><span>Delivery charge (\u09f3)</span><input id="o_ship" type="number" value="'+(Number(o.delivery_charge)||0)+'"></label>'
    + '</div>'
    + '<div style="font-weight:800;font-size:16px;color:var(--ink);margin:2px">Total: <span id="o_total">'+bdt(o.total)+'</span></div>'
    + '<div class="grid2" style="margin-top:14px">'
    +   '<label class="fld"><span>Order status</span><select id="o_status">'
    +     ORDER_STATES.map(s=>'<option value="'+s+'"'+(o.status===s?' selected':'')+'>'+ORDER_LABEL[s]+'</option>').join('')
    +   '</select></label>'
    +   '<label class="fld"><span>Payment status</span><select id="o_pay">'
    +     ['','Pending','Paid'].map(s=>'<option value="'+s+'"'+((o.payment_status||'')===s?' selected':'')+'>'+(s||'\u2014')+'</option>').join('')
    +   '</select></label>'
    + '</div>'
    + logHtml;

  const ov=openModal('Order \u2014 '+o.order_id, body, async (ov)=>{
    const zone=$('#o_zone',ov).value;
    const ship=Number($('#o_ship',ov).value)||0;
    const subN=Number(o.subtotal)||0, discN=Number(o.discount)||0;
    const obj={
      customer_name:$('#o_name',ov).value.trim(),
      phone:$('#o_phone',ov).value.trim(),
      address:$('#o_addr',ov).value.trim(),
      note:$('#o_note',ov).value.trim(),
      delivery_area: zone==='outside'?'Outside Dhaka':'Inside Dhaka',
      delivery_charge: ship,
      total: subN-discN+ship,
      status:$('#o_status',ov).value,
      payment_status:$('#o_pay',ov).value
    };
    if(!await dbSave('orders',obj,o.id)) return false;
    toast('Order updated','ok'); loadOrders(); return true;
  }, 'Save');

  const subN=Number(o.subtotal)||0, discN=Number(o.discount)||0;
  const zoneSel=$('#o_zone',ov), shipInp=$('#o_ship',ov), totOut=$('#o_total',ov);
  const recalc=()=>{ totOut.textContent=bdt(subN-discN+(Number(shipInp.value)||0)); };
  zoneSel.addEventListener('change',()=>{ shipInp.value = zoneSel.value==='outside'?charges.outside:charges.dhaka; recalc(); });
  shipInp.addEventListener('input',recalc);
}

async function renderCoupons(){
  loadingView();
  const rows=await dbList('coupons','id',true);
  $('#view').innerHTML=head('Coupons',`<button class="btn" id="addC">+ New Coupon</button>`)+'<div class="list" id="cList"></div>';
  $('#addC').addEventListener('click',()=>couponForm());
  const list=$('#cList');
  if(!rows.length){ list.innerHTML=emptyBox('🎟️','No coupons yet.','<button class="btn" onclick="couponForm()">+ Add a coupon</button>'); return; }
  list.innerHTML='';
  rows.forEach(c=>{
    const val=c.type==='percent'?`${c.value}%`:bdt(c.value);
    const row=el(`<div class="row"><div class="main">
      <div class="title">${esc(c.code)} ${c.active?'<span class="pill green">On</span>':'<span class="pill gray">Off</span>'}</div>
      <div class="meta">${val} off · min ${bdt(c.min_amount)}</div></div>
      <div class="acts"><button class="icon-btn">✏️</button><button class="icon-btn del">🗑️</button></div></div>`);
    row.querySelector('.icon-btn:not(.del)').addEventListener('click',()=>couponForm(c));
    row.querySelector('.del').addEventListener('click',()=>confirmModal(`"${c.code}" — delete?`,async()=>{if(await dbDelete('coupons',c.id)){toast('Deleted','ok');renderCoupons();}}));
    list.appendChild(row);
  });
}
window.couponForm=function(c){ c=c||{};
  const body=`
    <label class="fld"><span>Coupon code *</span><input id="c_code" value="${esc(c.code||'')}" placeholder="EID10" style="text-transform:uppercase"></label>
    <div class="grid2">
      <label class="fld"><span>Type</span><select id="c_type">
        <option value="flat"${c.type==='flat'?' selected':''}>Fixed amount (৳)</option>
        <option value="percent"${c.type==='percent'?' selected':''}>Percent (%)</option></select></label>
      <label class="fld"><span>Value *</span><input id="c_val" type="number" value="${c.value??''}"></label>
    </div>
    <label class="fld"><span>Minimum order (৳)</span><input id="c_min" type="number" value="${c.min_amount??0}"></label>
    <label class="fld"><span><input type="checkbox" id="c_active" ${c.active!==false?'checked':''} style="width:auto;margin-right:6px">On</span></label>`;
  openModal(c.id?'Edit Coupon':'New Coupon', body, async(ov)=>{
    const code=$('#c_code',ov).value.trim().toUpperCase(); if(!code){toast('Code is required','err');return false;}
    const obj={code,type:$('#c_type',ov).value,value:Number($('#c_val',ov).value||0),
      min_amount:Number($('#c_min',ov).value||0),active:$('#c_active',ov).checked};
    if(await dbSave('coupons',obj,c.id)){toast('Saved','ok');renderCoupons();return true;} return false;
  });
};

async function renderReviews(){
  loadingView();
  const rows=await dbList('reviews','created_at',false);
  $('#view').innerHTML=head('Reviews')+'<div class="list" id="rList"></div>';
  const list=$('#rList');
  if(!rows.length){ list.innerHTML=emptyBox('⭐','No reviews yet.'); return; }
  list.innerHTML='';
  rows.forEach(r=>{
    const stars='★'.repeat(r.rating||0)+'☆'.repeat(5-(r.rating||0));
    const pill=r.status==='approved'?'<span class="pill green">Approved</span>':'<span class="pill amber">Pending</span>';
    const row=el(`<div class="row"><div class="main">
      <div class="title">${esc(r.name)} <span style="color:var(--accent)">${stars}</span> ${pill}</div>
      <div class="meta">${esc(r.product||'')} · ${esc((r.review||'').slice(0,60))}</div></div>
      <div class="acts">
        ${r.status!=='approved'?'<button class="icon-btn" title="Approve" style="color:var(--green)">✓</button>':''}
        <button class="icon-btn del">🗑️</button></div></div>`);
    const ap=row.querySelector('.icon-btn:not(.del)');
    if(ap) ap.addEventListener('click',async()=>{ if(await dbSave('reviews',{status:'approved'},r.id)){toast('Approved','ok');renderReviews();} });
    row.querySelector('.del').addEventListener('click',()=>confirmModal('Delete review?',async()=>{if(await dbDelete('reviews',r.id)){toast('Deleted','ok');renderReviews();}}));
    list.appendChild(row);
  });
}

    {k:'store_name', l:'Store name'},
    {k:'logo_url',   l:'Logo link'},
    {k:'phone',      l:'Phone number'},
    {k:'whatsapp',   l:'WhatsApp number', hint:'8801XXXXXXXXX'},
    {k:'email',      l:'Email'},
    {k:'address',    l:'Address'},
  ]},
  { title:'Delivery charge', fields:[
    {k:'delivery_dhaka',   l:'Inside Dhaka (৳)', t:'number'},
    {k:'delivery_outside', l:'Outside Dhaka (৳)', t:'number'},
  ]},
  { title:'Home page text', fields:[
    {k:'hero_title', l:'Headline'},
    {k:'hero_sub',   l:'Sub-headline'},
    {k:'announce',   l:'Announcement bar', t:'textarea'},
  ]},
  { title:'Trust badges (4)', fields:[
    {k:'trust1', l:'Badge 1'}, {k:'trust2', l:'Badge 2'},
    {k:'trust3', l:'Badge 3'}, {k:'trust4', l:'Badge 4'},
  ]},
  { title:'Banner images (links)', fields:[
    {k:'banner1', l:'Banner 1'}, {k:'banner2', l:'Banner 2'},
    {k:'banner3', l:'Banner 3'}, {k:'banner4', l:'Banner 4'}, {k:'banner5', l:'Banner 5'},
  ]},
  { title:'Offer popup (optional)', fields:[
    {k:'popup_image',  l:'Popup image link'},
    {k:'popup_title',  l:'Popup title'},
    {k:'popup_button', l:'Button text'},
    {k:'popup_link',   l:'Button link'},
  ]},
  { title:'Social links', fields:[
    {k:'facebook',  l:'Facebook'}, {k:'messenger', l:'Messenger'},
    {k:'instagram', l:'Instagram'}, {k:'youtube',  l:'YouTube'},
    {k:'map_link',  l:'Google Map link'},
  ]},
  { title:'Payment', fields:[
    {k:'online_payment', l:'Online payment', t:'select', o:[['off','Off'],['on','On']]},
    {k:'payment_type',   l:'Payment type', t:'select', o:[['send_money','Send Money'],['payment','Payment']]},
    {k:'bkash_number',   l:'bKash number'},
    {k:'nagad_number',   l:'Nagad number'},
    {k:'rocket_number',  l:'Rocket number'},
    {k:'payment_note',   l:'Payment instructions', t:'textarea'},
  ]},
  { title:'Others', fields:[
    {k:'order_tracking', l:'Order tracking', t:'select', o:[['on','On'],['off','Off']]},
    {k:'order_whatsapp', l:'Also send orders to WhatsApp', t:'select', o:[['off','Off'],['on','On']]},
    {k:'categories',     l:'Category order (top bar)', t:'textarea', note:'Type the category names in the order you want them to appear, separated by commas — e.g. Science Kits, Best Seller, Books. Any category you do not list here shows up after these, automatically.'},
    {k:'footer_tagline', l:'Footer tagline'},
    {k:'owner_name',     l:'Owner name'},
    {k:'owner_quote',    l:'Owner quote', t:'textarea'},
    {k:'order_message',  l:'Order success message', t:'textarea'},
    {k:'review_message', l:'Review success message', t:'textarea'},
  ]},
];
async function renderSettings(){
  loadingView();
  const rows = await dbList('settings','key',true);
  const map = {}; rows.forEach(r=>{ map[r.key]=r.value; });
  let html = head('Settings', `<button class="btn" id="saveAllS">💾 Save all</button>`);
  html += `<p class="hintbar" style="margin-bottom:14px">Store name, phone, delivery charge, etc. — the storefront reads these. Edit and click save below.</p>`;
  SETTINGS_GROUPS.forEach(g=>{
    html += `<div style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px">
      <div class="disp" style="font-size:16px;margin-bottom:10px">${esc(g.title)}</div><div class="grid2">`;
    g.fields.forEach(f=>{
      const cur = map[f.k]!=null ? map[f.k] : '';
      const v = esc(cur);
      let input, wide='';
      if(f.t==='textarea'){ input=`<textarea data-k="${f.k}">${v}</textarea>`; wide=' style="grid-column:1/-1"'; }
      else if(f.t==='select'){ input=`<select data-k="${f.k}">${f.o.map(o=>`<option value="${o[0]}"${(cur||f.o[0][0])===o[0]?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`; }
      else input=`<input data-k="${f.k}" type="${f.t||'text'}" value="${v}" placeholder="${esc(f.hint||'')}">`;
      const note = f.note ? `<div class="hintbar">${esc(f.note)}</div>` : '';
      html += `<label class="fld"${wide}><span>${esc(f.l)}</span>${input}${note}</label>`;
    });
    html += `</div></div>`;
  });
  html += `<button class="btn full" id="saveAllS2" style="margin-bottom:20px">💾 Save all settings</button>`;
  $('#view').innerHTML = html;
  const doSave = async (btn)=>{
    btn.disabled=true; const t=btn.innerHTML; btn.innerHTML='<span class="spin"></span>';
    const payload = [...$('#view').querySelectorAll('[data-k]')].map(el=>({ key:el.getAttribute('data-k'), value:el.value }));
    const { error } = await SB.from('settings').upsert(payload);
    btn.disabled=false; btn.innerHTML=t;
    if(error){ toast(error.message,'err'); return; }
    toast('All settings saved','ok');
  };
  $('#saveAllS').addEventListener('click', e=>doSave(e.currentTarget));
  $('#saveAllS2').addEventListener('click', e=>doSave(e.currentTarget));
}

/* ---------- go ---------- */
boot();
</script>
</body>
</html>
