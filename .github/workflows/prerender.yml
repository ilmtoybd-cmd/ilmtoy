name: Prerender product pages

on:
  # index.html বা স্ক্রিপ্ট বদলালে
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/prerender.mjs'
      - '.github/workflows/prerender.yml'
  # প্রতি ৩০ মিনিটে — অ্যাডমিনে পণ্য/দাম/স্টক বদলালে data/site.json হালনাগাদ করতে
  # (তাড়া থাকলে Actions ট্যাব থেকে "Run workflow" চাপুন)
  schedule:
    - cron: '*/30 * * * *'
  # Actions ট্যাব থেকে হাতে চালানোর জন্য
  workflow_dispatch:

# নিজের কমিট পুশ করার অনুমতি
permissions:
  contents: write

# দুটো রান একসাথে চললে পুশে সংঘর্ষ হয়
concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate pages
        run: node scripts/prerender.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p data sitemap.xml robots.txt 404.html
          if git diff --staged --quiet; then
            echo "কোনো পরিবর্তন নেই — কমিট করার দরকার নেই"
          else
            git commit -m "chore: prerender product pages"
            git push
          fi
