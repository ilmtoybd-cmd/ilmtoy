name: Prerender product pages

on:
  # index.html বা স্ক্রিপ্ট বদলালে
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/prerender.mjs'
      - '.github/workflows/prerender.yml'
  # অ্যাডমিনে কিছু সেভ করলে Supabase নিজেই এটা চালু করে (supabase-setup.sql দেখুন)
  # — তাই পরিবর্তন ১–২ মিনিটে সাইটে চলে আসে
  repository_dispatch:
    types: [data-changed]
  # ব্যাকআপ হিসেবে প্রতি ৩০ মিনিটেও চলে
  schedule:
    - cron: '*/30 * * * *'
  # Actions ট্যাব থেকে হাতে চালানোর জন্য
  workflow_dispatch:

# নিজের কমিট পুশ করার অনুমতি
permissions:
  contents: write

# একসাথে একটাই চলে; এর মধ্যে আরও অনেকবার ডাক এলে শুধু সর্বশেষটা অপেক্ষায় থাকে
concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ছবি ছোট করে WebP বানানোর টুল
      - name: Install image tool
        run: npm install --no-save --no-package-lock --silent sharp@0.33.5

      - name: Generate pages, data and images
        run: node scripts/prerender.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p data img sitemap.xml robots.txt 404.html
          if git diff --staged --quiet; then
            echo "কোনো পরিবর্তন নেই — কমিট করার দরকার নেই"
          else
            git commit -m "chore: prerender product pages"
            # এর মধ্যে আপনি কিছু কমিট করে থাকলে পুশ আটকে যেত — আগে সেটা টেনে নেওয়া
            git pull --rebase -q origin main
            git push
          fi
